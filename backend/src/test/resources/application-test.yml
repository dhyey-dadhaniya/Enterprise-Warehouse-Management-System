spring:
  datasource:
    url: jdbc:h2:mem:wms_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true

app:
  jwt:
    secret: wms-test-jwt-secret-must-be-32bytes-min!
    expiration-ms: 3600000
