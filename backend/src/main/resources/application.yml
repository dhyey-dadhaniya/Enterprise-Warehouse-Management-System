server:
  port: 8080

# Local PostgreSQL: run `docker compose -f backend/docker-compose.yml up -d` from repo root.

spring:
  application:
    name: wms-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: wms
    password: wms

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:wms-dev-jwt-secret-must-be-32bytes-min!!}
    expiration-ms: 86400000

