server:
  port: ${SERVER_PORT:8080}

# Local PostgreSQL: from repo root run:
#   docker compose -f backend/docker-compose.yml up -d
# Override DB and secrets with env vars (see backend/.env.example).

spring:
  application:
    name: wms-backend

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/wms}
    username: ${SPRING_DATASOURCE_USERNAME:wms}
    password: ${SPRING_DATASOURCE_PASSWORD:wms}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:wms-dev-jwt-secret-must-be-32bytes-min!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

